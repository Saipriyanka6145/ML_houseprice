<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>House Price Prediction</title>
    <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>

    <style>
      .login {
        width: 400px;
        margin: 30px auto;
        font-family: 'Open Sans Condensed', sans-serif;
      }
      
      h1 {
        font-size: 2em;
        text-align: center;
        font-family: 'Pacifico', cursive;
        color: #3b3e47;
        margin-bottom: 50px;
      }
      
      input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: none;
        border-bottom: 2px solid #3b3e47;
        font-size: 1.2em;
        font-family: 'Arimo', sans-serif;
      }
      
      button[type="submit"] {
        display: block;
        width: 100%;
        padding: 10px;
        background-color: #3b3e47;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 1.2em;
        font-family: 'Arimo', sans-serif;
        cursor: pointer;
      }
      .result-text {
    font-size: 1.5em;
    font-weight: bold;
    text-align: center;
    color: #3b3e47;
    margin-top: 50px;
  }

      body {
  background-color: rgba(255, 255, 255, 0.9);
}


      
      button[type="submit"]:hover {
        background-color: #2b2e37;
      }
    </style>
  </head>

<body>
 <div class="login">
	<h1>House Price Prediction</h1>

     <!-- Main Input For Receiving Query to our ML -->
    <form action="{{ url_for('predict')}}"method="post">
      <input type="text" name="MedInc" placeholder="Median Income (e.g. 3.5)" required="required" /><br>
    	<input type="text" name="HouseAge" placeholder="House Age in Years (e.g. 20)" required="required" /><br>
        <input type="text" name="AveRooms" placeholder="Avg Rooms per House (e.g. 5.0)" required="required" /><br>
        <input type="text" name="AveBedrms" placeholder="Avg Bedrooms per House (e.g. 1.0)" required="required" /><br>
        <input type="text" name="Population" placeholder="Block Population (e.g. 800)" required="required" /><br>
        <input type="text" name="AveOccup" placeholder="Avg Occupants per House (e.g. 3.0)" required="required" /><br>
        <input type="text" name="Latitude" placeholder="Latitude (e.g. 34.05)" required="required" /><br>
        <input type="text" name="Longitude" placeholder="Longitude (e.g. -118.25)" required="required" /><br>

       

        <button type="submit" class="btn btn-primary btn-block btn-large">Predict</button>
    </form>

   <br>
   <br>
  
   
 </div>
 <p class="result-text">{{prediction_text}}</p>

</body>
</html>
